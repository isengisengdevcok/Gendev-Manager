
      # Android SDK - Stable Runner Configuration
      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"

          if [ ! -d "$SDK" ]; then
            echo "::error::Android SDK directory not found: $SDK"
            exit 1
          fi

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

          SDKMANAGER=$(find "$SDK/cmdline-tools" \
            -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found."
            exit 1
          fi

          echo "SDK Manager: $SDKMANAGER"
          echo "SDKMANAGER_PATH=$SDKMANAGER" >> "$GITHUB_ENV"

          "$SDKMANAGER" --version

      # Accept licenses
      - name: Accept Android SDK Licenses
        shell: bash
        run: |
          set +e
          yes | "$SDKMANAGER_PATH" \
            --sdk_root="$ANDROID_HOME" --licenses
          STATUS=${PIPESTATUS[1]}
          set -e

          if [ "$STATUS" -ne 0 ]; then
            echo "::error::SDK license acceptance failed."
            exit "$STATUS"
          fi

      # Install required Android packages with retry
      - name: Install Android SDK Packages
        shell: bash
        run: |
          set -e

          for attempt in 1 2 3; do
            echo "SDK installation attempt $attempt/3"

            if "$SDKMANAGER_PATH" \
              --sdk_root="$ANDROID_HOME" \
              --install \
              "platform-tools" \
              "platforms;android-35" \
              "build-tools;35.0.0"; then
              echo "Android SDK installation successful."
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              sleep 15
            fi
          done

          echo "::error::Android SDK installation failed after 3 attempts."
          exit 1
