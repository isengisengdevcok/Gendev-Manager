name: GENDEV MANAGER Android CI/CD Release

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      version_name:
        description: "Release version tag (e.g. 1.0.0)"
        required: false
        default: "1.0.0"

permissions:
  contents: write

jobs:
  build_and_release:
    name: Build, Test, Sign & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android Platform 36 & Build-Tools
        run: |
          SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMANAGER_BIN="$(command -v sdkmanager || echo "${SDK_DIR}/cmdline-tools/latest/bin/sdkmanager")"
          if [ -x "$SDKMANAGER_BIN" ]; then
            yes | "$SDKMANAGER_BIN" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER_BIN" "platform-tools" "platforms;android-36.1" "build-tools;36.0.0" || true
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Materialize Debug Keystore
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Verify Gradle Environment
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            GRADLE_CMD="./gradlew"
          else
            GRADLE_CMD="gradle"
          fi
          echo "GRADLE_CMD=$GRADLE_CMD" >> "$GITHUB_ENV"
          $GRADLE_CMD --version

      - name: Run Unit & Robolectric Tests
        run: $GRADLE_CMD :app:testDebugUnitTest --no-daemon

      - name: Run Android Lint Check
        run: $GRADLE_CMD :app:lintDebug --no-daemon

      - name: Build Debug APK
        run: $GRADLE_CMD :app:assembleDebug --no-daemon

      - name: Build & Sign Release APK (or Fallback to Debug APK)
        id: sign_apk
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p release_out
          DEBUG_APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)

          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ]; then
            EFFECTIVE_KEY_PASS="${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}"
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > /tmp/release-signing.jks

            # app/build.gradle.kts uses keyAlias="upload" for AGP's packageRelease task;
            # provide an ephemeral build keystore so assembleRelease completes for any user alias,
            # then re-align and re-sign with the user's real keystore via apksigner.
            rm -f /tmp/agp-temp-upload.jks
            keytool -genkeypair -v \
              -keystore /tmp/agp-temp-upload.jks \
              -storepass tempbuildpass \
              -alias upload \
              -keypass tempbuildpass \
              -keyalg RSA \
              -keysize 2048 \
              -validity 1 \
              -dname "CN=CI Build, O=GENDEV, C=US" > /dev/null 2>&1

            KEYSTORE_PATH=/tmp/agp-temp-upload.jks \
            STORE_PASSWORD=tempbuildpass \
            KEY_PASSWORD=tempbuildpass \
              $GRADLE_CMD :app:assembleRelease --no-daemon

            RELEASE_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
            SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
            BUILD_TOOLS_DIR=$(ls -d "${SDK_DIR}/build-tools/"* | sort -V | tail -n 1)

            "${BUILD_TOOLS_DIR}/zipalign" -f -p 4 "$RELEASE_APK" release_out/gendev-manager-aligned.apk
            "${BUILD_TOOLS_DIR}/apksigner" sign \
              --ks /tmp/release-signing.jks \
              --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
              --ks-key-alias "$ANDROID_KEY_ALIAS" \
              --key-pass env:EFFECTIVE_KEY_PASS \
              --out release_out/GENDEV-MANAGER-release-signed.apk \
              release_out/gendev-manager-aligned.apk
            "${BUILD_TOOLS_DIR}/apksigner" verify --verbose release_out/GENDEV-MANAGER-release-signed.apk

            rm -f /tmp/release-signing.jks /tmp/agp-temp-upload.jks release_out/gendev-manager-aligned.apk
            echo "apk_path=release_out/GENDEV-MANAGER-release-signed.apk" >> "$GITHUB_OUTPUT"
            echo "is_signed=true" >> "$GITHUB_OUTPUT"
          else
            # Verify release compilation & LintVital even when signing secrets are not configured
            $GRADLE_CMD :app:compileReleaseKotlin :app:lintVitalRelease --no-daemon
            cp "$DEBUG_APK" release_out/GENDEV-MANAGER-debug.apk
            echo "apk_path=release_out/GENDEV-MANAGER-debug.apk" >> "$GITHUB_OUTPUT"
            echo "is_signed=false" >> "$GITHUB_OUTPUT"
            echo "Signing secrets not configured; verified release compilation and publishing GENDEV-MANAGER-debug.apk."
          fi

      - name: Calculate SHA-256 & Generate Release Metadata
        id: meta
        run: |
          RAW_VERSION="${{ github.event.inputs.version_name }}"
          if [ -z "$RAW_VERSION" ]; then
            RAW_VERSION="1.0.0"
          fi
          VERSION="${RAW_VERSION#v}"
          TAG="v${VERSION}-${{ github.run_number }}"
          APK_FILE="${{ steps.sign_apk.outputs.apk_path }}"
          SHA256=$(sha256sum "$APK_FILE" | awk '{print $1}')
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          python3 .github/scripts/generate_release_assets.py \
            --version "$VERSION" \
            --tag "$TAG" \
            --apk-name "$(basename "$APK_FILE")" \
            --sha256 "$SHA256" \
            --signed "${{ steps.sign_apk.outputs.is_signed }}" \
            --repo "${{ github.repository }}"

      - name: Upload Build Reports & APK Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gendev-manager-build-${{ github.run_number }}
          if-no-files-found: warn
          path: |
            release_out/*
            release/metadata.json
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html

      - name: Publish GitHub Release
        if: success() && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "GENDEV MANAGER v${{ steps.meta.outputs.version }}"
          body_path: release/RELEASE_NOTES.md
          files: |
            ${{ steps.sign_apk.outputs.apk_path }}
            release/metadata.json
          fail_on_unmatched_files: true
