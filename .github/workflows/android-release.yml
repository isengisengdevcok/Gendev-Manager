name: GENDEV MANAGER Android CI/CD Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      version_name:
        description: "Release version tag (e.g. 1.0.0)"
        required: false
        default: "1.0.0"

permissions:
  contents: write

jobs:
  build:
    name: Build, Test, Lint & Package APK
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout Source
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Ensure Android Platform 36 & Build-Tools
        run: |
          SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -z "$SDK_DIR" ] && [ -d "/usr/local/lib/android/sdk" ]; then
            SDK_DIR="/usr/local/lib/android/sdk"
          fi
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"

          SDKMANAGER_BIN="$(command -v sdkmanager || echo "${SDK_DIR}/cmdline-tools/latest/bin/sdkmanager")"
          if [ -x "$SDKMANAGER_BIN" ]; then
            yes | "$SDKMANAGER_BIN" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER_BIN" "platform-tools" "platforms;android-36" "platforms;android-36.1" "build-tools;36.0.0" || true
          fi

      - name: Cache Robolectric Android Runtime
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            robolectric-${{ runner.os }}-

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Materialize Debug Keystore
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            tr -d '\r\n\t ' < debug.keystore.base64 | base64 -d > debug.keystore
          fi

      - name: Verify Gradle Environment
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            GRADLE_CMD="./gradlew"
          else
            GRADLE_CMD="gradle"
          fi
          echo "GRADLE_CMD=$GRADLE_CMD" >> "$GITHUB_ENV"
          $GRADLE_CMD --version

      - name: Build Debug APK
        env:
          GRADLE_OPTS: "-Xmx2560m -XX:MaxMetaspaceSize=640m -Dfile.encoding=UTF-8"
        run: |
          $GRADLE_CMD :app:assembleDebug \
            -Dorg.gradle.jvmargs="-Xmx2560m -XX:MaxMetaspaceSize=640m -Dfile.encoding=UTF-8" \
            --no-parallel --max-workers=1

      - name: Run Unit & Robolectric Tests
        env:
          GRADLE_OPTS: "-Xmx2560m -XX:MaxMetaspaceSize=640m -Dfile.encoding=UTF-8"
        run: |
          $GRADLE_CMD :app:testDebugUnitTest \
            -Dorg.gradle.jvmargs="-Xmx2560m -XX:MaxMetaspaceSize=640m -Dfile.encoding=UTF-8" \
            --no-parallel --max-workers=1

      - name: Run Android Lint
        env:
          GRADLE_OPTS: "-Xmx2560m -XX:MaxMetaspaceSize=640m -Dfile.encoding=UTF-8"
        run: |
          $GRADLE_CMD :app:lintDebug \
            -Dorg.gradle.jvmargs="-Xmx2560m -XX:MaxMetaspaceSize=640m -Dfile.encoding=UTF-8" \
            --no-parallel --max-workers=1

      - name: Build & Sign Release APK (or Package Verified Debug APK)
        id: sign_apk
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GRADLE_OPTS: "-Xmx2560m -XX:MaxMetaspaceSize=640m -Dfile.encoding=UTF-8"
        run: |
          mkdir -p release_bundle
          DEBUG_APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$DEBUG_APK" ] || [ ! -f "$DEBUG_APK" ]; then
            echo "ERROR: Debug APK was not generated by :app:assembleDebug"
            exit 1
          fi

          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ]; then
            export EFFECTIVE_KEY_PASS="${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n\t ' | base64 -d > /tmp/release-signing.jks

            rm -f /tmp/agp-temp-upload.jks
            keytool -genkeypair -v \
              -keystore /tmp/agp-temp-upload.jks \
              -storepass tempbuildpass \
              -alias upload \
              -keypass tempbuildpass \
              -keyalg RSA \
              -keysize 2048 \
              -validity 1 \
              -dname "CN=CI Build, O=GENDEV, C=US" > /dev/null 2>&1

            KEYSTORE_PATH=/tmp/agp-temp-upload.jks \
            STORE_PASSWORD=tempbuildpass \
            KEY_PASSWORD=tempbuildpass \
              $GRADLE_CMD :app:assembleRelease \
                -Dorg.gradle.jvmargs="-Xmx2560m -XX:MaxMetaspaceSize=640m -Dfile.encoding=UTF-8" \
                --no-parallel --max-workers=1

            RELEASE_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
            if [ -z "$RELEASE_APK" ] || [ ! -f "$RELEASE_APK" ]; then
              echo "ERROR: Release APK was not generated by :app:assembleRelease"
              exit 1
            fi

            SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
            BUILD_TOOLS_DIR=$(ls -d "${SDK_DIR}/build-tools/"* | sort -V | tail -n 1)
            if [ -z "$BUILD_TOOLS_DIR" ] || [ ! -x "${BUILD_TOOLS_DIR}/apksigner" ]; then
              echo "ERROR: Android build-tools apksigner not found under ${SDK_DIR}/build-tools"
              exit 1
            fi

            "${BUILD_TOOLS_DIR}/zipalign" -f -p 4 "$RELEASE_APK" release_bundle/gendev-manager-aligned.apk
            "${BUILD_TOOLS_DIR}/apksigner" sign \
              --ks /tmp/release-signing.jks \
              --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
              --ks-key-alias "$ANDROID_KEY_ALIAS" \
              --key-pass env:EFFECTIVE_KEY_PASS \
              --out release_bundle/GENDEV-MANAGER-release-signed.apk \
              release_bundle/gendev-manager-aligned.apk
            "${BUILD_TOOLS_DIR}/apksigner" verify --verbose release_bundle/GENDEV-MANAGER-release-signed.apk

            rm -f /tmp/release-signing.jks /tmp/agp-temp-upload.jks release_bundle/gendev-manager-aligned.apk
            echo "apk_path=release_bundle/GENDEV-MANAGER-release-signed.apk" >> "$GITHUB_OUTPUT"
            echo "is_signed=true" >> "$GITHUB_OUTPUT"
          else
            $GRADLE_CMD :app:compileReleaseKotlin :app:lintVitalRelease \
              -Dorg.gradle.jvmargs="-Xmx2560m -XX:MaxMetaspaceSize=640m -Dfile.encoding=UTF-8" \
              --no-parallel --max-workers=1
            cp "$DEBUG_APK" release_bundle/GENDEV-MANAGER-debug.apk
            echo "apk_path=release_bundle/GENDEV-MANAGER-debug.apk" >> "$GITHUB_OUTPUT"
            echo "is_signed=false" >> "$GITHUB_OUTPUT"
            echo "Signing secrets not configured; verified release compilation and packaged GENDEV-MANAGER-debug.apk."
          fi

      - name: Stop Gradle Daemon
        if: always()
        run: $GRADLE_CMD --stop || true

      - name: Calculate SHA-256 & Generate Release Metadata
        id: meta
        run: |
          RAW_VERSION="${{ github.event.inputs.version_name }}"
          if [ -z "$RAW_VERSION" ]; then
            if [ "${{ github.ref_type }}" = "tag" ]; then
              RAW_VERSION="${{ github.ref_name }}"
            else
              RAW_VERSION="1.0.0"
            fi
          fi
          VERSION="${RAW_VERSION#v}"
          TAG="v${VERSION}-${{ github.run_number }}"
          APK_FILE="${{ steps.sign_apk.outputs.apk_path }}"
          SHA256=$(sha256sum "$APK_FILE" | awk '{print $1}')
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          python3 .github/scripts/generate_release_assets.py \
            --version "$VERSION" \
            --tag "$TAG" \
            --apk-name "$(basename "$APK_FILE")" \
            --sha256 "$SHA256" \
            --signed "${{ steps.sign_apk.outputs.is_signed }}" \
            --repo "${{ github.repository }}"
          cp release/metadata.json release_bundle/metadata.json
          cp release/RELEASE_NOTES.md release_bundle/RELEASE_NOTES.md

      - name: Upload APK Bundle Artifact
        uses: actions/upload-artifact@v6
        with:
          name: gendev-manager-apk
          path: release_bundle/
          if-no-files-found: error

      - name: Upload Test & Lint Reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: gendev-manager-reports-${{ github.run_number }}
          if-no-files-found: ignore
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html

  publish_release:
    name: Publish GitHub Release
    needs: build
    if: success() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download APK Bundle Artifact
        uses: actions/download-artifact@v6
        with:
          name: gendev-manager-apk
          path: release_bundle

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ needs.build.outputs.tag }}
          name: "GENDEV MANAGER v${{ needs.build.outputs.version }}"
          body_path: release_bundle/RELEASE_NOTES.md
          files: |
            release_bundle/*.apk
            release_bundle/metadata.json
          fail_on_unmatched_files: true
          
