
name: GENDEV MANAGER Android CI/CD Release

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:
    inputs:
      version_name:
        description: "Release version (e.g. 1.0.0)"
        required: false
        default: "1.0.0"
        type: string

permissions:
  contents: write

concurrency:
  group: gendev-manager-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build_and_release:
    name: Build, Test, Sign & Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # 1. Checkout
      - name: Checkout Source
        uses: actions/checkout@v4

      # 2. Java
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # 3. Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # 4. Validate project
      - name: Validate Android Project
        run: |
          test -f settings.gradle || test -f settings.gradle.kts
          test -f app/build.gradle || test -f app/build.gradle.kts

          if [ ! -f gradlew ]; then
            echo "::error::Gradle wrapper not found."
            exit 1
          fi

          chmod +x gradlew
          ./gradlew --version

      # 5. Accept SDK licenses
      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      # 6. Install SDK components
      - name: Install Android Build Tools
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      # 7. Run tests
      - name: Run Unit Tests
        run: |
          ./gradlew :app:testDebugUnitTest \
            --no-daemon \
            --stacktrace

      # 8. Android Lint
      - name: Run Android Lint
        run: |
          ./gradlew :app:lintDebug \
            --no-daemon \
            --stacktrace

      # 9. Build debug
      - name: Build Debug APK
        run: |
          ./gradlew :app:assembleDebug \
            --no-daemon \
            --stacktrace

      # 10. Build release
      - name: Build Release APK
        run: |
          ./gradlew :app:assembleRelease \
            --no-daemon \
            --stacktrace

      # 11. Prepare output
      - name: Prepare Release Files
        id: prepare
        run: |
          set -e

          mkdir -p release_out release

          DEBUG_APK=$(find app/build/outputs/apk/debug \
            -type f -name "*.apk" | head -n 1)

          RELEASE_APK=$(find app/build/outputs/apk/release \
            -type f -name "*.apk" | head -n 1)

          if [ -z "$DEBUG_APK" ]; then
            echo "::error::Debug APK not found."
            exit 1
          fi

          if [ -z "$RELEASE_APK" ]; then
            echo "::error::Release APK not found."
            exit 1
          fi

          cp "$DEBUG_APK" release_out/GENDEV-MANAGER-debug.apk
          cp "$RELEASE_APK" release_out/GENDEV-MANAGER-release-unsigned.apk

          echo "debug_apk=release_out/GENDEV-MANAGER-debug.apk" >> "$GITHUB_OUTPUT"
          echo "release_apk=$RELEASE_APK" >> "$GITHUB_OUTPUT"

      # 12. Sign release
      - name: Sign Release APK
        id: sign_apk
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e

          SOURCE_APK="${{ steps.prepare.outputs.release_apk }}"
          OUTPUT_APK="release_out/GENDEV-MANAGER-release.apk"

          if [ -n "$KEYSTORE_BASE64" ] && \
             [ -n "$KEYSTORE_PASSWORD" ] && \
             [ -n "$KEY_ALIAS" ] && \
             [ -n "$KEY_PASSWORD" ]; then

            echo "$KEYSTORE_BASE64" | base64 --decode > signing.jks

            BUILD_TOOLS="${ANDROID_HOME}/build-tools/35.0.0"

            test -f signing.jks
            test -x "$BUILD_TOOLS/apksigner"

            "$BUILD_TOOLS/zipalign" -f -p 4 \
              "$SOURCE_APK" release_out/aligned.apk

            "$BUILD_TOOLS/apksigner" sign \
              --ks signing.jks \
              --ks-pass env:KEYSTORE_PASSWORD \
              --ks-key-alias "$KEY_ALIAS" \
              --key-pass env:KEY_PASSWORD \
              --out "$OUTPUT_APK" \
              release_out/aligned.apk

            "$BUILD_TOOLS/apksigner" verify --verbose "$OUTPUT_APK"

            rm -f signing.jks release_out/aligned.apk

            echo "apk_path=$OUTPUT_APK" >> "$GITHUB_OUTPUT"
            echo "is_signed=true" >> "$GITHUB_OUTPUT"

          else
            echo "::warning::Signing secrets incomplete. Release APK will remain unsigned."

            echo "apk_path=release_out/GENDEV-MANAGER-release-unsigned.apk" >> "$GITHUB_OUTPUT"
            echo "is_signed=false" >> "$GITHUB_OUTPUT"
          fi

      # 13. Generate metadata
      - name: Generate Release Metadata
        id: meta
        env:
          INPUT_VERSION: ${{ github.event.inputs.version_name }}
          RUN_NUMBER: ${{ github.run_number }}
          REPOSITORY: ${{ github.repository }}
          APK_PATH: ${{ steps.sign_apk.outputs.apk_path }}
          IS_SIGNED: ${{ steps.sign_apk.outputs.is_signed }}
        run: |
          set -e

          VERSION="${INPUT_VERSION:-1.0.0}"

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]; then
            echo "::error::Invalid version format."
            exit 1
          fi

          TAG="v${VERSION}-${RUN_NUMBER}"

          SHA256=$(sha256sum "$APK_PATH" | awk '{print $1}')

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

          if [ -f .github/scripts/generate_release_assets.py ]; then
            python3 .github/scripts/generate_release_assets.py \
              --version "$VERSION" \
              --tag "$TAG" \
              --apk-name "$(basename "$APK_PATH")" \
              --sha256 "$SHA256" \
              --signed "$IS_SIGNED" \
              --repo "$REPOSITORY"
          else
            python3 - <<'PY'
          import json, os
          from pathlib import Path

          data = {
              "name": "GENDEV MANAGER",
              "version": os.environ["INPUT_VERSION"] or "1.0.0",
              "tag": os.environ["GITHUB_REF_NAME"],
              "apk": os.path.basename(os.environ["APK_PATH"]),
              "sha256": os.environ.get("APK_PATH", ""),
              "signed": os.environ["IS_SIGNED"] == "true",
              "repository": os.environ["REPOSITORY"]
          }

          Path("release/metadata.json").write_text(
              json.dumps(data, indent=2) + "\n"
          )
          PY
          fi

          test -f release/metadata.json

      # 14. Release notes
      - name: Generate Release Notes
        run: |
          if [ ! -f release/RELEASE_NOTES.md ]; then
            cat > release/RELEASE_NOTES.md <<'EOF'
          # GENDEV MANAGER

          Automated Android build.

          ## Included
          - Debug APK
          - Release APK
          - SHA-256 checksum
          - Build metadata

          See metadata.json for build information.
          EOF
          fi

      # 15. Upload artifacts
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GENDEV-MANAGER-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 30
          path: |
            release_out/*.apk
            release/metadata.json
            release/RELEASE_NOTES.md
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html

      # 16. Publish GitHub Release
      - name: Publish GitHub Release
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: GENDEV MANAGER v${{ steps.meta.outputs.version }}
          body_path: release/RELEASE_NOTES.md
          files: |
            ${{ steps.sign_apk.outputs.apk_path }}
            release_out/GENDEV-MANAGER-debug.apk
            release/metadata.json
          fail_on_unmatched_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
